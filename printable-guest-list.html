<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Printable Guest List</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: white;
      color: #222;
      padding: 40px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      margin-bottom: 30px;
      color: #666;
    }

    .guest-list {
      max-width: 500px;
      margin: 0 auto;
      font-size: 18px;
      line-height: 1.8;
    }

    .guest-name {
      border-bottom: 1px solid #ddd;
      padding: 6px 0;
    }

    .print-button {
      display: block;
      margin: 30px auto;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    .status-note {
      max-width: 500px;
      margin: 20px auto 0;
      text-align: center;
      color: #666;
      font-size: 13px;
    }

    @media print {
      .print-button,
      .status-note {
        display: none;
      }

      body {
        padding: 20px;
      }

      .guest-name {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <h1>R & H Wedding 2027</h1>
  <div class="subtitle">Printable Guest List</div>

  <button class="print-button" onclick="window.print()">Print Guest List</button>

  <div id="guestList" class="guest-list">
    Loading guest list...
  </div>

  <div id="statusNote" class="status-note"></div>

  <script>
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRCgBeqgeZdnCPxojPcG0OP0wmbd0a5fJrSBf2rXt72oJBcPHFJPnbkpiytmBu53BKjwTivyrlBLR2I/pub?gid=1263874501&single=true&output=csv";

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let cell = "";
      let insideQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const next = text[i + 1];

        if (char === '"') {
          if (insideQuotes && next === '"') {
            cell += '"';
            i++;
          } else {
            insideQuotes = !insideQuotes;
          }
          continue;
        }

        if (char === ',' && !insideQuotes) {
          row.push(cell);
          cell = "";
          continue;
        }

        if ((char === '\n' || char === '\r') && !insideQuotes) {
          if (char === '\r' && next === '\n') i++;
          row.push(cell);
          rows.push(row);
          row = [];
          cell = "";
          continue;
        }

        cell += char;
      }

      row.push(cell);
      rows.push(row);
      return rows;
    }

    function escapeHtml(value) {
      return value
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function normalizeName(value) {
      return value
        .replace(/\s+/g, " ")
        .replace(/\s+\./g, ".")
        .trim();
    }

    function extractNamesFromCsv(csvText) {
      const rows = parseCsv(csvText);
      const seen = new Set();
      const names = [];

      rows.forEach(row => {
        row.forEach(cell => {
          String(cell || "")
            .split(/\n|,|;| {2,}/)
            .map(normalizeName)
            .filter(Boolean)
            .forEach(name => {
              const lower = name.toLowerCase();

              if (lower === "guest name" || lower === "no confirmed guests yet") return;
              if (seen.has(lower)) return;

              seen.add(lower);
              names.push(name);
            });
        });
      });

      return names.sort((a, b) => a.localeCompare(b));
    }

    async function loadGuestList() {
      const guestListDiv = document.getElementById("guestList");
      const statusNote = document.getElementById("statusNote");

      try {
        const freshCsvUrl = `${SHEET_CSV_URL}&cacheBust=${Date.now()}`;
        const response = await fetch(freshCsvUrl, { cache: "no-store" });

        if (!response.ok) {
          throw new Error(`CSV request failed: ${response.status}`);
        }

        const csvText = await response.text();
        const names = extractNamesFromCsv(csvText);

        guestListDiv.innerHTML = names.length
          ? names.map(name => `<div class="guest-name">${escapeHtml(name)}</div>`).join("")
          : "No confirmed guests yet.";

        statusNote.textContent = names.length
          ? `${names.length} guest name${names.length === 1 ? "" : "s"} shown.`
          : "";
      } catch (error) {
        guestListDiv.innerHTML = "Unable to load guest list.";
        statusNote.textContent = "Please check that the Google Sheet tab is published as CSV.";
        console.error(error);
      }
    }

    loadGuestList();
  </script>
</body>
</html>
